name: Windows application (0.2.0 rebuild, dearpygui 2.1.1)

on:
  push:
    branches: [ci/rebuild-0.2.0-dpg211]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Точный набор пакетов, который установил pip в сборке релиза 0.2.0
          # (лог рана 38842761319, шаг "Install dependencies"), с единственной
          # заменой: dearpygui 2.3.1 -> 2.1.1 (версия из uv.lock проекта).
          # 2.3.1 падает при удалении узла со связями, 2.1.1 — нет.
          pip install "absl-py==2.5.1" "altgraph==0.17.5" "astunparse==1.6.3" "certifi==2026.7.22" "charset_normalizer==3.5.2" "dearpygui==2.1.1" "flatbuffers==25.12.19" "gast==0.7.0" "google-pasta==0.2.0" "grpcio==1.84.0" "h5py==3.16.0" "idna==3.20" "keras==3.15.1" "libclang==18.1.1" "markdown==3.11.1" "markdown-it-py==4.2.0" "markupsafe==3.0.4" "mdurl==0.1.2" "ml-dtypes==0.6.0" "namex==0.1.0" "numpy==2.1.3" "opt-einsum==3.4.0" "optree==0.20.0" "pefile==2024.8.26" "pillow==12.3.0" "protobuf==5.29.6" "pydot==4.0.1" "pygments==2.21.0" "pyinstaller==6.22.3" "pyinstaller-hooks-contrib==2026.8" "pyparsing==3.3.3" "pywin32-ctypes==0.2.3" "requests==2.34.2" "rich==15.0.0" "setuptools==84.0.0" "six==1.17.0" "tensorboard==2.19.0" "tensorboard-data-server==0.7.2" "tensorflow==2.19.0" "termcolor==3.3.0" "typing-extensions==4.16.0" "urllib3==2.8.0" "werkzeug==3.1.9" "wheel==0.48.0" "wrapt==2.5.1"

      - name: Build application
        run: python scripts/build_exe.py

      - name: Verify bundle
        run: python scripts/verify_bundle.py dist/GraphNet

      - name: Smoke test executable outside checkout
        shell: pwsh
        run: |
          $executable = (Resolve-Path 'dist/GraphNet/GraphNet.exe').Path
          $smokeDirectory = Join-Path $env:RUNNER_TEMP 'GraphNet smoke Кириллица'
          New-Item -ItemType Directory -Force $smokeDirectory | Out-Null
          $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -WorkingDirectory $smokeDirectory -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw 'GraphNet smoke test did not exit: an import is blocking or the app is showing an error dialog'
          }
          if ($process.ExitCode -ne 0) { throw "GraphNet smoke test failed with exit code $($process.ExitCode)" }
          $log = Get-ChildItem (Join-Path $smokeDirectory 'Logs') -Filter *.log -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $log) { throw 'GraphNet did not create its log' }
          Write-Host "--- $($log.Name) ---"
          Get-Content $log.FullName
          # --smoke-test exits before the GUI event loop, so reaching the end of
          # startup means every import resolved: the log alone is not enough,
          # because it is created while Src.Logging is imported, before
          # Src.Nodes pulls in Keras.
          if (-not (Select-String -Path $log.FullName -Pattern 'SMOKE TEST OK' -Quiet)) {
            throw 'GraphNet stopped before startup completed'
          }
          Write-Host 'GraphNet imported every dependency and built the node editor'

      - name: Zip application and dependencies
        shell: pwsh
        run: Compress-Archive -Path dist/GraphNet -DestinationPath dist/GraphNet-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GraphNet-Windows-x64-fixed
          path: dist/GraphNet-Windows-x64.zip
          if-no-files-found: error