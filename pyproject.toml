[project]
name = "graphnet"
version = "0.1.0"
description = "Visual neural network constructor built with Dear PyGui and Keras"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "dearpygui==2.1.1",
    "numpy<2.2.0",
    "pillow>=12.0.0",
    "pydot>=4.0.1",
    "tensorflow>=2.19.0"
]

[project.scripts]
graphnet = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["Tests"]

[tool.hatch.build.targets.wheel]
packages = ["Src"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"Assets" = "Assets"

[tool.hatch.build.targets.sdist]
include = [
    "/Src",
    "/Assets",
    "/Tests",
    "/main.py",
    "/README.md",
    "/pyproject.toml",
    "/uv.lock",
    "/LICENSE*",
]
