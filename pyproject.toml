[project]
name = "graphnet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "dearpygui>=2.1.0",
    "librosa==0.11",
    "numpy<2.2.0",
    "pillow>=12.0.0",
    "pydot>=4.0.1",
    "tensorflow>=2.19.0",
    "matplotlib>=3.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["Tests"]

[dependency-groups]
dev = [
    "coverage>=7.14.2",
    "pytest>=9.1.1",
    "pyinstaller==6.22.3",
]

[tool.coverage.run]
source = ["Src"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
exclude_also = [
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
