[project]
name = "graphnet-constructor"
version = "0.1.0"
description = "Visual neural network constructor built with Dear PyGui and Keras"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "dearpygui>=2.1.0",
    "librosa==0.11",
    "numpy<2.2.0",
    "pillow>=12.0.0",
    "pydot>=4.0.1",
    "tensorflow==2.19.0",
    "matplotlib>=3.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["Tests"]

[dependency-groups]
dev = [
    "coverage>=7.14.2",
    "pytest>=9.1.1",
]

[tool.coverage.run]
source = ["Src"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
exclude_also = [
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
graphnet = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["Src"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"
"app.py" = "app.py"
"Assets" = "Assets"

[tool.hatch.build.targets.sdist]
include = ["/Src", "/Assets", "/Tests", "/main.py", "/app.py", "/README.md", "/pyproject.toml", "/uv.lock", "/LICENSE*"]
